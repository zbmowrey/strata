# Tool pins per profile. Each [tools.<name>] table is copied into
# .strata/tools.toml for the profiles an instance uses; `strata doctor`
# compares `version` with the output of `check`.
[tools.gofumpt]
profile = "go"
version = "0.12.0"
check = ["gofumpt", "--version"]
install = "go install mvdan.cc/gofumpt@v0.12.0"

[tools.goimports]
profile = "go"
version = "0.52.0"
check = ["go", "version", "-m", "goimports"]
install = "go install golang.org/x/tools/cmd/goimports@v0.52.0"

[tools.golangci-lint]
profile = "go"
version = "2.15.0"
check = ["golangci-lint", "version"]
install = "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0"

[tools.govulncheck]
profile = "go"
version = "1.1.4"
check = ["govulncheck", "-version"]
install = "go install golang.org/x/vuln/cmd/govulncheck@latest"

[tools.ruff]
profile = "python"
version = "0.14.0"
check = ["ruff", "--version"]
install = "uv tool install ruff"

[tools.pyright]
profile = "python"
version = "1.1.389"
check = ["pyright", "--version"]
install = "uv tool install pyright"

[tools.prettier]
profile = "ts"
version = "3.6.2"
check = ["prettier", "--version"]
install = "pnpm add -D prettier"

[tools.tsc]
profile = "ts"
version = "5.9.3"
check = ["tsc", "--version"]
install = "pnpm add -D typescript"

[tools.eslint]
profile = "ts"
version = "9.39.0"
check = ["eslint", "--version"]
install = "pnpm add -D eslint typescript-eslint eslint-plugin-sonarjs"

[tools.cargo-clippy]
profile = "rust"
version = "0.1.90"
check = ["cargo", "clippy", "--version"]
install = "rustup component add clippy"

[tools.shellcheck]
profile = "shell"
version = "0.11.0"
check = ["shellcheck", "--version"]
install = "brew install shellcheck"

[tools.shfmt]
profile = "shell"
version = "3.14.1"
check = ["shfmt", "--version"]
install = "go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1"

[tools.typos]
profile = "docs"
version = "1.52.0"
check = ["typos", "--version"]
install = "brew install typos-cli"

[tools.gitleaks]
profile = "security"
version = "8.30.1"
check = ["gitleaks", "version"]
install = "go install github.com/zricethezav/gitleaks/v8@v8.30.1"

[tools.semgrep]
profile = "security"
version = "1.169.0"
check = ["semgrep", "--version"]
install = "uv tool install semgrep==1.169.0"

[tools.osv-scanner]
profile = "security"
version = "2.7.0"
check = ["osv-scanner", "--version"]
install = "go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0"
