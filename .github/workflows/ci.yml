name: ci
on:
  push:
    branches: [main, "build/**"]
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.3" # = the toolchain line in engine/go.mod (tools must be built with it)
          cache-dependency-path: engine/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install gate tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          pipx install semgrep==1.169.0
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          curl -fsSL -o typos.tgz https://github.com/crate-ci/typos/releases/download/v1.52.0/typos-v1.52.0-x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$HOME/.local/bin" && tar -xzf typos.tgz -C "$HOME/.local/bin" ./typos && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just check
      - run: just test
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.3" # = the toolchain line in engine/go.mod (tools must be built with it)
          cache-dependency-path: engine/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just bench
        env:
          STRATA_BUDGETS: report  # CI hardware differs from the baseline machine; budgets are enforced locally (01 §7)
