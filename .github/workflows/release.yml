name: release
# Triggered by the vX.Y.Z tag that `just release` pushes. Builds with goreleaser into a DRAFT
# release, signs checksums.txt with cosign (keyless, GitHub OIDC), attests build provenance, and
# attaches the provenance bundle. The owner reviews and publishes the draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build, e.g. after a failed release run"
        required: true
        type: string
permissions:
  contents: read
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # keyless signing and provenance
      attestations: write # GitHub artifact attestations
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3" # = the toolchain line in engine/go.mod
          cache-dependency-path: engine/go.sum
      # cosign-installer v3.x cannot install cosign v3 (no .sig assets); v4 installs cosign v3.1.4.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The tagged commit already passed `just check` and `just test` on main (required checks).
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Attach provenance to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "strata_${TAG#v}.intoto.jsonl"
          gh release upload "$TAG" "strata_${TAG#v}.intoto.jsonl" --repo "$GITHUB_REPOSITORY"
